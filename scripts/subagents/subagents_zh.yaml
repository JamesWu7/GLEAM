version: 2
pipeline_name: GLEAM_精简常驻自治流水线
policy:
  no_direct_push_main: true
  single_code_writer: 修复工程代理
  auto_push_after_review: true
  auto_repair_on_failed_checks: true

subagents:
  - id: supervisor_agent
    中文名称: 总控代理
    英文名称: Supervisor Agent
    阶段: 全流程
    主要职责: 编排流程、统一产物、自动推送修复分支并创建PR。
    输入: 各阶段产物
    输出: 自动推送分支、PR、流程摘要
    可并行: false
    可写代码: false

  - id: ci_explorer_agent
    中文名称: CI日志探索代理
    英文名称: CI Explorer Agent
    阶段: 分析
    主要职责: 执行并解析R CMD build/check日志，提取失败关键信息。
    输入: 仓库代码、CI执行日志
    输出: CI失败摘要、错误片段
    可并行: true
    可写代码: false

  - id: pkgdown_explorer_agent
    中文名称: 文档构建探索代理
    英文名称: pkgdown Explorer Agent
    阶段: 分析
    主要职责: 执行pkgdown构建并检查教程/参考页可访问性。
    输入: 仓库代码、pkgdown日志
    输出: pkgdown状态报告、缺页清单
    可并行: true
    可写代码: false

  - id: bug_analyzer_agent
    中文名称: 根因分析代理
    英文名称: Bug Analyzer Agent
    阶段: 根因定位
    主要职责: 汇总日志并输出结构化根因结论。
    输入: ci/pkgdown 报告
    输出: error_type、file_location、root_cause、fix_strategy
    可并行: false
    可写代码: false

  - id: fix_engineer_agent
    中文名称: 修复工程代理
    英文名称: Fix Engineer Agent
    阶段: 修复
    主要职责: 仅做最小修改并保持API边界稳定。
    输入: 根因分析结论
    输出: 代码补丁、变更清单
    可并行: false
    可写代码: true

  - id: test_runner_agent
    中文名称: 测试验证代理
    英文名称: Test Runner Agent
    阶段: 验证
    主要职责: 运行 check/tests/pkgdown 并生成可审计验证结果。
    输入: 修复补丁、仓库代码
    输出: 验证状态、日志工件
    可并行: false
    可写代码: false

  - id: final_reviewer_agent
    中文名称: 最终复核代理
    英文名称: Final Reviewer Agent
    阶段: 复核
    主要职责: 回归风险评估并给出是否可自动推送结论。
    输入: 修复补丁、验证日志
    输出: readiness结论（ready_for_human_review / needs_changes）
    可并行: false
    可写代码: false

  - id: pr_writer_agent
    中文名称: PR文案代理
    英文名称: PR Writer Agent
    阶段: PR生成
    主要职责: 自动生成PR标题、提交信息与说明。
    输入: 根因结论、验证结果、变更清单
    输出: PR标题、commit message、PR正文
    可并行: false
    可写代码: false

phase_map:
  phase_1_analysis_parallel:
    - ci_explorer_agent
    - pkgdown_explorer_agent
  phase_2_root_cause:
    - bug_analyzer_agent
  phase_3_fix:
    - fix_engineer_agent
  phase_4_validation:
    - test_runner_agent
  phase_5_review:
    - final_reviewer_agent
  phase_6_pr_content:
    - pr_writer_agent
  phase_7_supervision:
    - supervisor_agent
