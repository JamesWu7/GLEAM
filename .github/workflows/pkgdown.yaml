name: pkgdown

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pkgdown
  cancel-in-progress: true

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libglpk40 libglpk-dev
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          needs: website
          extra-packages: |
            any::pkgdown
            any::knitr
            any::rmarkdown
            any::Seurat
            any::SeuratObject
            any::ggridges
            monocle3=?ignore
      - name: Install GLEAM package for pkgdown reference/examples
        run: R CMD INSTALL --no-build-vignettes .
      - name: Build and validate pkgdown site
        run: scripts/pipeline/pkgdown_build_and_validate.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pkgdown-site
          path: docs
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
        with:
          path: docs

  deploy-pages:
    needs: build-site
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
